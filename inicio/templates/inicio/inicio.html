{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h2 class="text-5xl font-black">
    Buenos días, {{ request.user.username }} 👋
</h2>

<p class="text-slate-300 mb-8">
    La disciplina supera a la motivación.
</p>

<div class="grid md:grid-cols-4 gap-6">
    <div class="card rounded-3xl p-6 bg-gradient-to-br from-cyan-500 to-blue-700">
        <h3>Nivel</h3>
        <p class="text-5xl font-black">12</p>
    </div>

    <div class="card rounded-3xl p-6 bg-gradient-to-br from-orange-400 to-red-600">
        <h3>Racha</h3>
        <p class="text-5xl font-black">15🔥</p>
    </div>

    <div class="card rounded-3xl p-6 bg-gradient-to-br from-violet-500 to-fuchsia-700">
        <h3>Logros</h3>
        <p class="text-5xl font-black">18🏆</p>
    </div>

    <div class="card rounded-3xl p-6 bg-gradient-to-br from-emerald-500 to-green-700">
        <h3>Productividad</h3>
        <p class="text-5xl font-black">87%</p>
    </div>
</div>

<div class="mt-8 grid lg:grid-cols-2 gap-6">

    <div class="card bg-slate-800 rounded-3xl p-6">
        <h3 class="text-2xl font-bold mb-4">Heatmap</h3>

        <div class="grid grid-cols-7 gap-2 text-center text-2xl">
            <div>🟩</div><div>🟩</div><div>⬜</div>
            <div>🟩</div><div>🟩</div><div>🟩</div><div>🟩</div>
        </div>
    </div>

    <div class="card bg-slate-800 rounded-3xl p-6">
        <h3 class="text-2xl font-bold">Objetivo semanal</h3>

        <div class="mt-5 h-5 bg-slate-600 rounded-full">
            <div class="h-5 w-4/5 rounded-full bg-gradient-to-r from-cyan-400 to-purple-500"></div>
        </div>

        <p class="mt-3">80% completado</p>
    </div>

</div>

{% endblock %}
